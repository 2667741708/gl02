<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>主次诊断结论｜颜色层级预览</title><style>
:root{--safe:#38e47a;--watch:#ffb21b;--danger:#ff4f63}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 70% 8%,#0c3970 0,transparent 38%),#020d21;color:#eef7ff;font-family:SimSun,"宋体",serif}.page{width:min(980px,calc(100% - 40px));margin:50px auto}.note{color:#8baaca;font-size:14px}.panel{border:1px solid #2364ad;border-radius:7px;background:linear-gradient(180deg,#08254f,#05172f);box-shadow:inset 0 0 25px rgba(48,141,255,.12)}.head{height:52px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid rgba(78,148,220,.62);font-weight:bold;font-size:22px}.body{padding:26px;display:grid;grid-template-columns:170px 1fr;gap:28px}.furnace{height:240px;border:1px solid #1c528e;border-radius:6px;background:linear-gradient(180deg,#062348,#04152b);display:grid;place-items:center}.furnace svg{width:115px}.lines{display:grid;align-content:center;gap:16px}.row{display:grid;grid-template-columns:105px 1fr auto;align-items:center;gap:12px;font-size:23px;font-weight:bold}.label{color:#dcecff}.kind{border-left:5px solid var(--kind);padding-left:11px;color:var(--kind)}.score{font:900 16px Consolas;border:1px solid var(--risk);border-radius:4px;color:var(--risk);padding:6px 9px;background:color-mix(in srgb,var(--risk) 14%,transparent)}.meter{grid-column:2/4;height:10px;border-radius:8px;background:#21466f;overflow:hidden}.meter span{display:block;height:100%;width:var(--value);background:var(--risk);box-shadow:0 0 12px var(--risk)}.explain{grid-column:2/4;margin-top:-4px;color:#a8c3dc;font-size:14px;line-height:1.6}.callout{margin:0 26px 24px;padding:12px 14px;border-left:4px solid #14b8a6;background:rgba(20,184,166,.08);color:#cfe5f0;font-size:14px;line-height:1.65}.risk-key{color:#a7c0d7}@media(max-width:680px){.page{width:calc(100% - 20px);margin:15px auto}.body{grid-template-columns:1fr;padding:16px}.furnace{display:none}.row{grid-template-columns:78px 1fr}.score{grid-column:2}.meter,.explain{grid-column:1/3}}
</style></head><body><main class="page"><p class="note">独立方案预览：此页面专门处理现有“主诊断 / 次诊断 / 判断把握”区域。</p><section class="panel"><header class="head">当前诊断结论</header><div class="body"><div class="furnace"><svg viewBox="0 0 120 160" aria-label="高炉图标"><path d="M42 12h36l11 43-10 77H41L31 55z" fill="#274d78" stroke="#8abce8" stroke-width="4"/><path d="M43 65h34l9 61H34z" fill="#8b5cf6" opacity=".32"/><path d="M51 72h18l8 47H43z" fill="#f4511e"/><path d="M55 84h10l5 33H50z" fill="#ffdc45"/></svg></div><div class="lines">
<div class="row" style="--kind:#8b5cf6;--risk:#ff4f63;--value:82%"><span class="label">主诊断：</span><span class="kind">管道行程</span><span class="score">高风险 · 82 / 100</span><div class="meter"><span></span></div><div class="explain">“管道行程”固定为紫色，红色只用于提示当前风险等级为高。</div></div>
<div class="row" style="--kind:#14b8a6;--risk:#ffb21b;--value:46%"><span class="label">次诊断：</span><span class="kind">边缘煤气流发展</span><span class="score">关注 · 46 / 100</span><div class="meter"><span></span></div><div class="explain">“边缘煤气流发展”固定为青绿色，琥珀黄表示需要关注。</div></div>
<div class="row" style="--kind:#38e47a;--risk:#38e47a;--value:86%"><span class="label">顺行状态：</span><span class="kind">正常顺行</span><span class="score">安全 · 86 / 100</span><div class="meter"><span></span></div><div class="explain">正常顺行是正向分数，因此类别色与安全色均使用绿色。</div></div>
</div></div><div class="callout"><b>界面规则：</b>炉况名称、左侧色条和趋势图例固定使用类别色；<span class="risk-key">“安全 / 关注 / 高风险”、分数徽标和进度条</span>才使用三档风险色。这样类别为琥珀黄的“料线异常”不会被误读为必然处于“关注”状态。</div></section></main></body></html>
