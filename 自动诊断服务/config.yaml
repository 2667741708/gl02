version: 1
timezone: Asia/Shanghai

database:
  host_env: GL02_PGHOST
  port_env: GL02_PGPORT
  database_env: GL02_PGDATABASE
  user_env: GL02_PGUSER
  password_env: GL02_PGPASSWORD
  default_host: 10.30.220.12
  default_port: 5432
  default_database: bf_trend
  schema: bf_sensor
  connect_timeout_seconds: 10

diagnosis:
  # core19: only the declared 19 core variables.
  # full115: all enabled physical variables in sensor_registry, including body-temperature arrays.
  # Machine/user env GL02_RULE_PROFILE overrides this value for scheduled tasks.
  rule_profile: full115
  baseline_days: 30
  window_minutes: 60
  diagnosis_interval_minutes: 5
  startup_backfill_hours: 24
  min_window_coverage_ratio: 0.75
  enforce_sync_barrier: true
  repair_invalid_snapshots: true
  sync_wait_timeout_seconds: 600
  sync_wait_poll_seconds: 15
  max_source_lag_minutes_ok: 5
  max_source_lag_minutes_warn: 10

zero_value_policy:
  enabled: true
  # Any zero read from one_minute_values is treated as missing unless pSpace
  # confirms the same tag/minute is still zero in bf_sensor.zero_value_audits.
  # The auditor follows the sync source mode in 数据库同步和存取/config/sync_config.json
  # so raw sample rows are verified by the same raw sample rule, not processed averages.
  require_pspace_audit: true
  audit_table: zero_value_audits
  verified_status: verified_zero
  epsilon: 1.0e-9

source:
  type: local_pg
  database: bf_trend
  schema: bf_sensor
  table: one_minute_values
  read_policy: local_database_primary

paths:
  rule_engine_dir: rule_engine
  runtime_dir: 自动诊断服务/runtime
  sync_config: 数据库同步和存取/config/sync_config.json

