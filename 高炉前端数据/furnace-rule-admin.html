<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>33项炉况规则后台管理</title>
<style>
:root{color-scheme:dark;--bg:#101820;--panel:#182631;--line:#476273;--text:#eef3f5;--muted:#aebdc6;--safe:#5cd69a;--warn:#ffc857;--danger:#ff6b6b;--action:#2b7899}
*{box-sizing:border-box}body{font-family:SimSun,"宋体",serif;background:var(--bg);color:var(--text);margin:0;padding:16px;line-height:1.45}button,input,textarea,select{font:inherit}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px}.top h1{font-size:24px;margin:0}.actions,.tabs,.filters{display:flex;gap:8px;flex-wrap:wrap}button,.button{border:1px solid #4c8099;background:#17384a;color:var(--text);padding:8px 12px;border-radius:4px;cursor:pointer}button:hover{background:#21556d}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:var(--action)}.danger{border-color:var(--danger)}.notice{margin:12px 0;padding:10px 12px;border:1px solid var(--line);background:var(--panel)}.notice.error{border-color:var(--danger);color:#ffd5d5}.notice.warn{border-color:var(--warn);color:#ffe8ad}.tabs button.active,.filters button.active{background:#276f8e}.panel{margin-top:12px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}.table-wrap{overflow:auto;max-height:calc(100vh - 235px);border:1px solid var(--line)}table{border-collapse:collapse;width:100%;min-width:1180px}th,td{border-bottom:1px solid #334b59;padding:7px 8px;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#243a48;z-index:2}tr.rule-head td{background:#1d3441;font-weight:bold}.mono{font-family:Consolas,monospace;font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.safe{color:var(--safe)}.warn-text{color:var(--warn)}.danger-text{color:var(--danger)}.weight{width:82px;background:#0f1d25;border:1px solid #587082;color:var(--text);padding:5px}.sum-bad{color:var(--danger);font-weight:bold}.sum-ok{color:var(--safe)}textarea{width:100%;min-height:150px;background:#0f1d25;color:var(--text);border:1px solid var(--line);padding:8px}.config-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.config-card{background:var(--panel);border:1px solid var(--line);padding:10px}.publish{position:sticky;bottom:0;background:#101820;border-top:1px solid var(--line);padding:10px 0;display:flex;gap:8px;align-items:center}.publish input{min-width:340px;background:#0f1d25;color:var(--text);border:1px solid var(--line);padding:8px}.empty{padding:30px;text-align:center;color:var(--muted)}[hidden]{display:none!important}@media(max-width:900px){.config-grid{grid-template-columns:1fr}.top,.toolbar,.publish{align-items:stretch;flex-direction:column}.publish input{min-width:0;width:100%}.table-wrap{max-height:none}}
.login-panel{max-width:520px;margin:48px auto;padding:22px;border:1px solid var(--line);background:var(--panel)}.login-panel h2{margin-top:0}.login-grid{display:grid;gap:12px}.login-grid label{display:grid;gap:5px}.login-grid input{width:100%;background:#0f1d25;color:var(--text);border:1px solid var(--line);padding:10px}.login-actions{display:flex;gap:8px;align-items:center;margin-top:14px}
</style>
</head>
<body>
<header class="top"><div><h1>33项炉况规则后台管理</h1><div class="muted">仅管理员可查看内部因子、权重、归一化值和贡献；所有修改只影响只读诊断，不下发生产控制。</div></div><div class="actions"><a class="button" href="/#optimization">返回建议页面</a><button id="refresh">刷新</button><button id="logout" hidden>退出管理员登录</button></div></header>
<div id="state" class="notice">正在校验管理员权限并读取规则…</div>
<section id="loginPanel" class="login-panel" hidden><h2>管理员登录</h2><p class="muted">登录成功后才会从服务器读取公式、权重、阈值和单项贡献。</p><form id="loginForm"><div class="login-grid"><label>管理员账号<input id="loginUser" autocomplete="username" required></label><label>密码<input id="loginPassword" type="password" autocomplete="current-password" required></label></div><div class="login-actions"><button id="loginButton" class="primary" type="submit">登录并打开规则管理</button><span id="loginState"></span></div></form></section>
<main id="content" hidden>
  <nav class="tabs"><button data-view="runtime" class="active">33项当前值与贡献</button><button data-view="config">权重与阈值修改</button></nav>
  <section id="runtimePanel" class="panel">
    <div class="toolbar"><div class="filters"><label>开始时间 <input id="historyStart" type="datetime-local"></label><label>结束时间 <input id="historyEnd" type="datetime-local"></label><button id="queryHistory">查询计算批次</button><label>计算时刻 <select id="evaluationSelect"></select></label></div></div>
    <div class="toolbar"><div id="runtimeMeta" class="muted"></div><div class="filters"><button data-cat="ALL" class="active">全部33项</button><button data-cat="A">A类9项</button><button data-cat="B">B类13项</button><button data-cat="C">C类11项</button></div></div>
    <div class="table-wrap"><table><thead><tr><th>规则</th><th>物理因子</th><th>来源实际值/窗口统计</th><th>归一化风险因子</th><th>小项分数</th><th>权重</th><th>分数×权重</th><th>阈值/基线</th><th>规则总分</th><th>置信度/状态</th></tr></thead><tbody id="runtimeRows"></tbody></table></div>
  </section>
  <section id="configPanel" class="panel" hidden>
    <div class="notice warn">修改必须填写原因并通过服务端校验。每条规则有效权重必须合计100；当前仍处于影子核验时，不会因此自动开放生产分数或B/C告警。</div>
    <div class="config-grid"><div class="config-card"><h2>质量门禁</h2><textarea id="quality"></textarea></div><div class="config-card"><h2>分数分带</h2><textarea id="scoreBands"></textarea></div><div class="config-card"><h2>通用特征阈值</h2><textarea id="featureThresholds"></textarea></div><div class="config-card"><h2>因子阈值</h2><textarea id="termThresholds"></textarea></div></div>
    <h2>33项规则权重</h2><div class="table-wrap"><table><thead><tr><th>规则</th><th>因子及物理含义</th><th>默认权重</th><th>当前有效权重</th><th>规则合计</th></tr></thead><tbody id="weightRows"></tbody></table></div>
    <div class="publish"><label>配置版本 <input id="configVersion" autocomplete="off"></label><label>变更原因 <input id="reason" autocomplete="off" placeholder="必填，例如：经工艺会议批准调整A4权重"></label><button id="publish" class="primary">校验并发布</button><span id="publishState"></span></div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);let configData=null,catalog=[],runtime=[],activeCat='ALL',activeEvaluationId=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>v===null||v===undefined||Number.isNaN(Number(v))?'—':Number(v).toFixed(4);
function status(message,type=''){const el=$('state');el.className='notice '+type;el.textContent=message}
async function getJson(url){const r=await fetch(url,{credentials:'same-origin',cache:'no-store'});const d=await r.json().catch(()=>({ok:false,error:'invalid_json'}));if(!r.ok)throw Object.assign(new Error(d.error||('HTTP '+r.status)),{status:r.status});return d}
function objectLines(value){if(!value||typeof value!=='object'||!Object.keys(value).length)return '—';return Object.entries(value).map(([k,v])=>`${esc(k)} = ${esc(typeof v==='object'?JSON.stringify(v):v)}`).join('<br>')}
function renderRuntime(){const rows=$('runtimeRows');const chosen=runtime.filter(r=>activeCat==='ALL'||r.category===activeCat);if(!chosen.length){rows.innerHTML='<tr><td colspan="10" class="empty">当前没有可用的后台计算批次</td></tr>';return}let html='';for(const r of chosen){const terms=new Map((r.contributions||[]).map(x=>[x.feature_key,x]));const weights=r.weights||{};const names=Object.keys(weights);html+=`<tr class="rule-head"><td>${esc(r.rule_id)} ${esc(r.display_name)}</td><td colspan="7">可用 ${terms.size}/${names.length} 项；缺失：${esc((r.missing_features||[]).join('、')||'无')}</td><td class="mono">${num(r.score)}</td><td>${num(Number(r.confidence)*100)}% · ${esc(r.status)}</td></tr>`;for(const key of names){const t=terms.get(key),p=t&&t.physical||{},actual=t?{...(t.source_values||{}),...(t.source_features||{})}:null,threshold=t&&t.effective_thresholds,baseline=t&&t.baseline_snapshot;html+=`<tr><td></td><td title="${esc(p.meaning||'')}">${esc(p.label||key)}<div class="muted mono">${esc(key)}</div><div class="muted">${esc(p.meaning||'')}</div></td><td class="mono">${objectLines(actual)}</td><td class="mono">${num(t&&t.normalized_value)}</td><td class="mono">${num(t&&Number(t.normalized_value)*100)}</td><td class="mono">${num(weights[key])}%</td><td class="mono">${num(t&&t.contribution)}</td><td><details><summary>查看阈值/基线</summary><div class="mono">${objectLines(threshold)}</div><div class="mono">${objectLines(baseline)}</div></details></td><td></td><td class="${t?'safe':'warn-text'}">${t?'可计算':'缺数据/基线/阈值'}</td></tr>`}}rows.innerHTML=html}
function weightSum(rule){return rule.terms.reduce((s,t)=>s+Number(t.effective_weight||0),0)}
function renderWeights(){let html='';for(const rule of catalog){rule.terms.forEach((term,index)=>{const sum=weightSum(rule);html+=`<tr data-rule="${esc(rule.rule_id)}"><td>${index===0?esc(rule.rule_id+' '+rule.display_name):''}</td><td>${esc(term.physical.label)}<div class="muted">${esc(term.physical.meaning)}</div><div class="mono muted">${esc(term.feature_key)}</div></td><td class="mono">${num(term.default_weight)}%</td><td><input class="weight" type="number" min="0" max="100" step="0.1" data-rule="${esc(rule.rule_id)}" data-term="${esc(term.feature_key)}" value="${esc(term.effective_weight)}"></td><td class="rule-sum ${Math.abs(sum-100)<.000001?'sum-ok':'sum-bad'}" data-sum="${esc(rule.rule_id)}">${num(sum)}%</td></tr>`})}$('weightRows').innerHTML=html;document.querySelectorAll('input.weight').forEach(input=>input.oninput=()=>{const rule=catalog.find(x=>x.rule_id===input.dataset.rule),term=rule.terms.find(x=>x.feature_key===input.dataset.term);term.effective_weight=Number(input.value);document.querySelectorAll(`[data-sum="${rule.rule_id}"]`).forEach(el=>{const sum=weightSum(rule);el.textContent=num(sum)+'%';el.className='rule-sum '+(Math.abs(sum-100)<.000001?'sum-ok':'sum-bad')})})}
function fillConfig(){const pretty=v=>JSON.stringify(v,null,2);$('quality').value=pretty(configData.quality);$('scoreBands').value=pretty(configData.score_bands);$('featureThresholds').value=pretty(configData.feature_thresholds);$('termThresholds').value=pretty(configData.term_thresholds);$('configVersion').value=configData.config_version||'';renderWeights()}
function localInput(date){const shifted=new Date(date.getTime()-date.getTimezoneOffset()*60000);return shifted.toISOString().slice(0,16)}
async function loadBatch(evaluationId){const suffix=evaluationId?`?evaluation_id=${encodeURIComponent(evaluationId)}`:'';const r=await getJson('/api/admin/furnace-rules/latest-full'+suffix);activeEvaluationId=r.evaluation_id;runtime=r.rules||[];$('runtimeMeta').textContent=`计算时刻 ${r.evaluation_ts||'无'} · 批次 ${r.evaluation_id||'无'} · 配置 ${r.config_version||configData.config_version} · ${runtime.length}/33项`;renderRuntime()}
async function loadHistory(){const query=new URLSearchParams({start:new Date($('historyStart').value).toISOString(),end:new Date($('historyEnd').value).toISOString(),limit:'288'});const data=await getJson('/api/admin/furnace-rules/history?'+query);const select=$('evaluationSelect');select.innerHTML=(data.batches||[]).map(b=>`<option value="${esc(b.id)}">${esc(new Date(b.evaluation_ts).toLocaleString())} · ${esc(b.rule_count)}/33</option>`).join('');if(!select.options.length)throw new Error('所选时间范围没有计算批次');await loadBatch(select.value)}
async function load(){status('正在读取管理员规则合同…');$('content').hidden=true;$('loginPanel').hidden=true;try{const c=await getJson('/api/admin/furnace-rules/config');configData=c.config;catalog=c.catalog||[];const now=new Date(),start=new Date(now.getTime()-6*3600000);if(!$('historyEnd').value){$('historyStart').value=localInput(start);$('historyEnd').value=localInput(now)};$('content').hidden=false;$('logout').hidden=false;fillConfig();await loadHistory();status(`管理员权限已通过；可按时间查询历史计算批次和${catalog.length}条规则。`)}catch(e){$('logout').hidden=true;$('content').hidden=true;if(e.status===403){$('loginPanel').hidden=false;status('请使用系统管理员账号登录后查看核心规则。','warn')}else status('读取失败：'+e.message,'error')}}
$('queryHistory').onclick=async()=>{try{status('正在查询所选时间范围…');await loadHistory();status('历史计算批次已加载。')}catch(e){status('查询失败：'+e.message,'error')}};
$('evaluationSelect').onchange=async()=>{try{await loadBatch($('evaluationSelect').value)}catch(e){status('批次加载失败：'+e.message,'error')}};
$('loginForm').onsubmit=async event=>{event.preventDefault();const button=$('loginButton'),out=$('loginState');button.disabled=true;out.textContent='正在登录…';try{const response=await fetch('/api/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('loginUser').value.trim(),password:$('loginPassword').value})});const data=await response.json().catch(()=>({}));if(!response.ok||!data.ok)throw new Error(data.message||data.error||('HTTP '+response.status));if(!String(data.role||'').match(/admin|管理/i))throw new Error('当前账号不是管理员角色');$('loginPassword').value='';out.textContent='登录成功';await load()}catch(e){$('loginPassword').value='';out.textContent='登录失败：'+e.message}finally{button.disabled=false}};
$('logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'});configData=null;catalog=[];runtime=[];await load()};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));$('runtimePanel').hidden=b.dataset.view!=='runtime';$('configPanel').hidden=b.dataset.view!=='config'});
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));renderRuntime()});
$('publish').onclick=async()=>{const out=$('publishState');try{for(const rule of catalog){const sum=weightSum(rule);if(Math.abs(sum-100)>.000001)throw new Error(`${rule.rule_id}权重合计为${sum}，必须等于100`)}const reason=$('reason').value.trim();if(!reason)throw new Error('必须填写变更原因');const next=structuredClone(configData);next.config_version=$('configVersion').value.trim();if(!next.config_version)throw new Error('配置版本不能为空');next.quality=JSON.parse($('quality').value);next.score_bands=JSON.parse($('scoreBands').value);next.feature_thresholds=JSON.parse($('featureThresholds').value);next.term_thresholds=JSON.parse($('termThresholds').value);for(const rule of catalog){next.rules[rule.rule_id].weight_overrides=Object.fromEntries(rule.terms.map(t=>[t.feature_key,Number(t.effective_weight)]))}out.textContent='正在服务端校验并原子发布…';$('publish').disabled=true;const response=await fetch('/api/admin/furnace-rules/config/publish',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-BF-Admin-Action':'publish-abc-rule-config'},body:JSON.stringify({config:next,reason})});const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error||('HTTP '+response.status));out.textContent=`发布成功：${data.published.config_version} · ${data.published.config_hash}`;await load()}catch(e){out.textContent='发布失败：'+e.message}finally{$('publish').disabled=false}};
$('refresh').onclick=load;load();
</script>
</body></html>
