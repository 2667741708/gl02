<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>高炉工艺大模型智能决策系统</title>
  <script src="libs/react.development.js"></script>
  <script src="libs/react-dom.development.js"></script>
  <script src="libs/babel.min.js"></script>
  <script src="libs/echarts.min.js"></script>
  <script src="assets/curve-inspector.js?v=20260811-hourly-range-r1"></script>
  <style>
    * {
      box-sizing: border-box
    }

    html,
    body,
    #root {
      width: 100%;
      height: 100%
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      background: #020916;
      color: #dcecff
    }

    button {
      font-family: inherit
    }

    .app {
      width: 100%;
      height: 100%;
      min-width: 1280px;
      display: grid;
      grid-template-rows: 62px 1fr 76px;
      background: linear-gradient(90deg, rgba(0, 132, 255, .08) 1px, transparent 1px), linear-gradient(0deg, rgba(0, 132, 255, .05) 1px, transparent 1px), radial-gradient(circle at 50% 0%, rgba(0, 133, 255, .2), transparent 42%), #020916;
      background-size: 44px 44px, 44px 44px, 100% 100%, 100% 100%
    }

    .topbar {
      display: grid;
      grid-template-columns: 530px 1fr 54px;
      align-items: center;
      border-bottom: 1px solid #104574;
      background: linear-gradient(180deg, rgba(7, 19, 39, .98), rgba(2, 8, 19, .96));
      box-shadow: 0 0 22px rgba(0, 134, 255, .25)
    }

    .brand {
      height: 100%;
      display: flex;
      align-items: center;
      padding-left: 24px;
      position: relative;
      overflow: hidden
    }

    .brand:after {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 80px;
      background: linear-gradient(135deg, transparent 0 48%, #104574 49% 51%, transparent 52%)
    }

    .brand-title {
      font-size: 26px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: 1px;
      color: #f4fbff;
      text-shadow: 0 0 14px rgba(100, 190, 255, .7)
    }

    .status-strip {
      height: 100%;
      display: grid;
      grid-template-columns: repeat(6, minmax(126px, 1fr));
      align-items: center
    }

    .top-item {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-left: 1px solid rgba(29, 110, 176, .55);
      color: #c3d4e8;
      font-size: 15px;
      white-space: nowrap
    }

    .top-value {
      color: #f1f7ff;
      font-weight: 800
    }

    .warn,
    .text-warn {
      color: #ffb21b
    }

    .bad,
    .text-bad {
      color: #ff4f63
    }

    .good,
    .text-good {
      color: #38e47a
    }

    .refresh {
      font-size: 30px;
      color: #18a8ff;
      text-align: center
    }

    .main {
      min-height: 0;
      padding: 8px 10px 6px;
      overflow: hidden
    }

    .screen {
      height: 100%;
      display: grid;
      gap: 8px;
      min-height: 0
    }

    .overview-grid {
      grid-template-columns: 25% 45% 30%;
      grid-template-rows: 58% 42%
    }

    .diagnosis-grid {
      grid-template-columns: 28% 34% 38%;
      grid-template-rows: 64% 36%
    }

    .opt-grid {
      grid-template-columns: 23% 50% 27%;
      grid-template-rows: 70% 30%
    }

    .trend-grid {
      grid-template-columns: 43% 34% 23%;
      grid-template-rows: 38px 45% 1fr
    }

    .qa-grid {
      grid-template-columns: 24% 50% 26%;
      grid-template-rows: 64% 36%
    }

    .panel {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      border: 1px solid #0d5598;
      border-radius: 6px;
      background: linear-gradient(180deg, rgba(6, 30, 58, .96), rgba(3, 17, 34, .96));
      box-shadow: inset 0 0 20px rgba(0, 118, 255, .13), 0 0 12px rgba(0, 70, 150, .22);
      display: flex;
      flex-direction: column
    }

    .panel-head {
      height: 34px;
      flex: 0 0 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid rgba(27, 113, 188, .55);
      background: linear-gradient(90deg, rgba(7, 44, 82, .95), rgba(3, 22, 44, .75))
    }

    .panel-title {
      color: #f1f7ff;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: .4px
    }

    .panel-title:before {
      content: "▣";
      color: #12a9ff;
      margin-right: 8px;
      font-size: 14px
    }

    .panel-note {
      color: #8fb8d8;
      font-size: 13px
    }

    .panel-body {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      padding: 8px
    }

    .span-2 {
      grid-column: span 2
    }

    .row-span-2 {
      grid-row: span 2
    }

    .metric-list {
      display: grid;
      gap: 4px
    }

    .metric-row {
      display: grid;
      grid-template-columns: 30px 1fr 78px 50px 70px;
      align-items: center;
      gap: 6px;
      min-height: 32px;
      padding: 3px 6px;
      border: 1px solid rgba(30, 105, 166, .45);
      background: rgba(3, 25, 49, .7)
    }

    .metric-no {
      color: #7fbaff;
      font-family: Consolas, monospace
    }

    .metric-name {
      color: #d9eaff;
      font-weight: 800
    }

    .metric-value {
      color: #f6fbff;
      font-size: 16px;
      font-weight: 900;
      text-align: right;
      font-family: Consolas, monospace
    }

    .metric-unit {
      color: #adc8df;
      font-size: 12px
    }

    .spark {
      width: 68px;
      height: 20px
    }

    .furnace-wrap {
      height: 100%;
      display: grid;
      grid-template-columns: 44% 56%;
      gap: 10px;
      align-items: center
    }

    .furnace-stage {
      height: 100%;
      min-height: 330px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .furnace-svg {
      width: 92%;
      height: 96%;
      filter: drop-shadow(0 0 16px rgba(0, 151, 255, .28))
    }

    .callout {
      position: absolute;
      left: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #dcecff;
      font-weight: 800
    }

    .callout:after {
      content: "";
      width: 132px;
      height: 1px;
      background: linear-gradient(90deg, #238be6, transparent)
    }

    .c1 {
      top: 17%
    }

    .c2 {
      top: 31%
    }

    .c3 {
      top: 48%
    }

    .c4 {
      top: 63%
    }

    .c5 {
      top: 79%
    }

    .furnace-side {
      display: grid;
      gap: 12px;
      align-content: center
    }

    .temp-card {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 18px;
      align-items: center;
      padding: 14px;
      border: 1px solid #1676bd;
      border-radius: 5px;
      background: rgba(4, 26, 52, .85)
    }

    .heat-disc {
      width: 132px;
      height: 92px;
      border-radius: 50%;
      background: radial-gradient(circle, #0bb6ff 0 20%, #1fd2ff 21% 31%, #ffe66a 45%, #ff8a1d 62%, #ff4d27 78%);
      box-shadow: inset 0 0 18px rgba(255, 255, 255, .35), 0 0 18px rgba(255, 115, 22, .35)
    }

    .state-card {
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 16px;
      border: 1px solid rgba(27, 120, 196, .75);
      border-radius: 4px;
      background: rgba(8, 46, 82, .74);
      font-size: 18px;
      font-weight: 900
    }

    .state-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #14c8ff;
      border: 1px solid #1682d3;
      background: rgba(0, 100, 180, .18)
    }

    .diagnosis-hero {
      height: 100%;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 8px;
      padding: 12px 14px
    }

    .diag-line {
      font-size: 21px;
      font-weight: 900;
      color: #edf8ff
    }

    .diag-line b {
      color: #ff4f63;
      margin-left: 10px
    }

    .diag-line .secondary {
      color: #ffb21b
    }

    .confidence {
      display: grid;
      grid-template-columns: 130px 1fr 54px;
      align-items: center;
      gap: 12px
    }

    .bar {
      height: 10px;
      border-radius: 8px;
      background: #12375c;
      overflow: hidden
    }

    .bar-fill {
      height: 100%;
      border-radius: 8px;
      background: linear-gradient(90deg, #0d75ff, #18d8ff);
      box-shadow: 0 0 12px rgba(20, 197, 255, .7)
    }

    .evidence-list,
    .card-list {
      display: grid;
      gap: 6px
    }

    .evidence-item {
      padding: 7px 9px;
      border-left: 3px solid #2b9cff;
      background: rgba(8, 38, 72, .75);
      color: #cfe2f5;
      line-height: 1.45
    }

    .evidence-item b {
      color: #fff
    }

    .score-row {
      display: grid;
      grid-template-columns: 28px 1fr 50px;
      gap: 6px;
      align-items: center;
      padding: 3px 6px;
      border: 1px solid rgba(32, 103, 164, .45);
      background: rgba(5, 29, 56, .72)
    }

    .rank {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #0a3d72;
      color: #bfe7ff;
      font-weight: 900
    }

    .rank.top {
      color: #07111e;
      background: linear-gradient(180deg, #ffdc45, #ff8a1d)
    }

    .score-name {
      font-size: 15px;
      color: #eaf6ff;
      font-weight: 900
    }

    .score-val {
      color: #ff5367;
      font-size: 19px;
      font-weight: 900;
      font-family: Consolas, monospace;
      text-align: right
    }

    .rule-hit {
      display: grid;
      grid-template-columns: 20px 1fr 62px;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      font-size: 12px;
      border: 1px solid rgba(32, 103, 164, .45);
      background: rgba(5, 29, 56, .72)
    }

    .check {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #43d55c;
      color: #092014;
      font-size: 12px;
      font-weight: 900
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px
    }

    .mini-chart-card {
      min-height: 108px;
      border: 1px solid rgba(32, 103, 164, .7);
      border-radius: 5px;
      background: rgba(4, 25, 49, .78);
      padding: 8px;
      display: grid;
      grid-template-rows: 30px 1fr
    }

    .mini-title {
      display: flex;
      justify-content: space-between;
      color: #eaf6ff;
      font-weight: 900
    }

    .chart {
      width: 100%;
      height: 100%;
      min-height: 70px
    }

    .chart-empty {
      height: 100%;
      display: grid;
      place-items: center;
      color: #7da8c9;
      border: 1px dashed rgba(55, 130, 190, .45)
    }

    .action-card {
      border: 1px solid rgba(32, 112, 180, .75);
      border-radius: 5px;
      background: linear-gradient(180deg, rgba(7, 45, 82, .9), rgba(4, 26, 51, .9));
      padding: 7px;
      min-height: 92px
    }

    .action-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px
    }

    .action-title {
      color: #f2f8ff;
      font-size: 15px;
      font-weight: 900
    }

    .level {
      padding: 2px 7px;
      border-radius: 3px;
      border: 1px solid #d9821b;
      color: #ffb33d;
      background: rgba(160, 83, 7, .25);
      font-weight: 900
    }

    .action-body {
      color: #bdd3e8;
      font-size: 12px;
      line-height: 1.35
    }

    .category-list {
      display: grid;
      gap: 10px
    }

    .category {
      display: grid;
      grid-template-columns: 42px 1fr 32px;
      align-items: center;
      gap: 8px;
      padding: 7px;
      border: 1px solid rgba(32, 112, 180, .75);
      border-radius: 5px;
      background: rgba(7, 42, 78, .72)
    }

    .cat-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      font-size: 26px;
      color: #8dc8ff;
      border-radius: 6px;
      background: rgba(33, 126, 216, .18)
    }

    .cat-name {
      color: #f1f8ff;
      font-size: 15px;
      font-weight: 900
    }

    .cat-desc {
      color: #a9c3dc;
      font-size: 12px;
      line-height: 1.25
    }

    .count {
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid #337cc3;
      border-radius: 4px;
      color: #eaf6ff;
      background: rgba(13, 64, 112, .75);
      font-family: Consolas, monospace
    }

    .sequence {
      display: grid;
      gap: 6px
    }

    .seq-item {
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 8px;
      align-items: start
    }

    .seq-no {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #2f75bc, #123a6b);
      color: #fff;
      font-size: 18px;
      font-weight: 900
    }

    .seq-title {
      color: #ffcb40;
      font-weight: 900;
      font-size: 15px
    }

    .seq-desc {
      color: #bdd3e8;
      line-height: 1.25;
      font-size: 12px
    }

    .risk-box {
      border: 1px solid #b67416;
      border-radius: 5px;
      background: rgba(90, 45, 5, .22);
      padding: 7px;
      color: #ffd27a;
      line-height: 1.35;
      font-size: 12px
    }

    .table {
      width: 100%;
      border-collapse: collapse;
      color: #cfe3f6;
      font-size: 12px;
      table-layout: fixed
    }

    .table th,
    .table td {
      border: 1px solid rgba(33, 103, 164, .5);
      padding: 5px 6px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .table th {
      color: #eaf6ff;
      background: rgba(11, 48, 86, .85)
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 0
    }

    .seg {
      display: inline-flex;
      border: 1px solid #185f9e;
      border-radius: 5px;
      overflow: hidden
    }

    .seg button {
      height: 34px;
      min-width: 112px;
      border: 0;
      border-right: 1px solid #185f9e;
      background: rgba(5, 24, 47, .9);
      color: #b8cce2;
      cursor: pointer;
      font-size: 15px
    }

    .seg button:last-child {
      border-right: 0
    }

    .seg button.active {
      color: #fff;
      background: linear-gradient(180deg, #0f58bd, #0a3280);
      box-shadow: inset 0 0 18px rgba(48, 159, 255, .38)
    }

    .qa-list {
      display: grid;
      gap: 6px
    }

    .qa-btn {
      min-height: 48px;
      display: grid;
      grid-template-columns: 34px 1fr 20px;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
      border: 1px solid rgba(32, 112, 180, .75);
      border-radius: 6px;
      background: rgba(5, 31, 59, .86);
      color: #dcecff;
      text-align: left;
      font-size: 16px;
      cursor: pointer
    }

    .qa-btn.active {
      border-color: #26a7ff;
      box-shadow: 0 0 14px rgba(31, 143, 255, .5), inset 0 0 18px rgba(31, 143, 255, .18)
    }

    .answer {
      height: 100%;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 6px
    }

    .chat-line {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 6px;
      align-items: start
    }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #234c7d;
      color: #dcecff;
      font-weight: 900
    }

    .bubble {
      padding: 6px 8px;
      border-radius: 7px;
      background: rgba(7, 42, 78, .72);
      border: 1px solid rgba(32, 112, 180, .65);
      color: #dcecff;
      line-height: 1.32;
      font-size: 13px
    }

    .chat-input {
      width: 100%;
      min-height: 34px;
      resize: vertical;
      border: 1px solid #246fae;
      border-radius: 5px;
      background: rgba(2, 14, 29, .85);
      color: #eaf6ff;
      padding: 10px;
      font-size: 15px;
      line-height: 1.5;
      outline: none
    }

    .ask-btn {
      margin-top: 8px;
      height: 34px;
      min-width: 96px;
      border: 1px solid #26a7ff;
      border-radius: 5px;
      background: linear-gradient(180deg, #0f58bd, #0a3280);
      color: #fff;
      font-weight: 900;
      cursor: pointer
    }

    .ask-btn:disabled {
      opacity: .6;
      cursor: wait
    }

    .trend-main {
      grid-row: 2 / 4
    }

    .trend-table {
      height: 100%;
      font-size: 11px;
      line-height: 1.12
    }

    .trend-table th,
    .trend-table td {
      padding: 3px 4px;
      font-size: 11px
    }

    .trend-insights {
      display: grid;
      grid-template-rows: repeat(4, 1fr);
      gap: 6px;
      height: 100%
    }

    .trend-insights .evidence-item {
      display: flex;
      align-items: center;
      font-size: 13px;
      line-height: 1.35
    }

    .anomaly-grid {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 8px
    }

    .anomaly-card {
      border: 1px solid #b67416;
      border-radius: 5px;
      background: rgba(90, 45, 5, .22);
      padding: 8px;
      color: #ffd27a;
      font-size: 13px;
      line-height: 1.45
    }

    .event-mini {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 5px 8px;
      font-size: 12px;
      color: #bdd3e8
    }

    .event-mini b {
      color: #eaf6ff
    }

    .forecast-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border: 1px solid #247cc1;
      border-radius: 4px;
      background: rgba(9, 55, 98, .72);
      color: #dcecff;
      font-size: 12px
    }

    .forecast-btn {
      height: 34px;
      border: 1px solid #26a7ff;
      border-radius: 5px;
      background: linear-gradient(180deg, #0f58bd, #0a3280);
      color: #fff;
      font-weight: 900;
      cursor: pointer;
      padding: 0 12px
    }

    .forecast-btn:disabled {
      opacity: .6;
      cursor: wait
    }

    .bottom-nav {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      padding: 7px 18px 8px;
      border-top: 1px solid #104574;
      background: linear-gradient(180deg, rgba(3, 13, 29, .96), rgba(1, 8, 19, .98))
    }

    .nav-btn {
      border: 1px solid #15548f;
      min-height: 58px;
      border-radius: 6px;
      background: linear-gradient(180deg, rgba(8, 33, 65, .96), rgba(3, 18, 38, .96));
      color: #9eb7d4;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      cursor: pointer;
      font-size: 21px;
      font-weight: 800;
      min-width: 0
    }

    .nav-btn span:last-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .nav-btn.active {
      color: #fff;
      border-color: #12a6ff;
      background: linear-gradient(180deg, #0b4eb2, #082d76);
      box-shadow: 0 0 18px rgba(20, 137, 255, .65), inset 0 0 18px rgba(67, 170, 255, .34)
    }

    .nav-icon {
      font-size: 30px;
      color: #8da8d8;
      flex: 0 0 auto
    }

    .nav-btn.active .nav-icon {
      color: #bfe8ff
    }

    .muted {
      color: #8fa9c4
    }

    .mono {
      font-family: Consolas, "Courier New", monospace
    }

    .grid-cards {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px
    }

    .placeholder {
      height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
      color: #9db8d4;
      line-height: 1.8
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px
    }

    ::-webkit-scrollbar-thumb {
      background: #1a5f98;
      border-radius: 6px
    }

    ::-webkit-scrollbar-track {
      background: rgba(4, 18, 35, .7)
    }

    @media(max-width:1500px) {
      .brand-title {
        font-size: 23px
      }

      .top-item {
        font-size: 13px
      }

      .nav-btn {
        font-size: 17px
      }

      .nav-icon {
        font-size: 25px
      }

      .metric-row {

    /* animated 3D furnace and anti-overlap fixes */
    .furnace-wrap.is-3d {
      grid-template-columns: minmax(340px, 48%) 1fr;
      gap: 14px
    }

    .furnace-stage-3d {
      height: 100%;
      min-height: 360px;
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      perspective: 900px
    }

    .furnace-3d-scene {
      position: relative;
      width: min(92%, 430px);
      height: 100%;
      min-height: 350px;
      transform-style: preserve-3d;
      animation: furnaceOrbit 9s ease-in-out infinite alternate
    }

    .furnace-particles {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 4;
      pointer-events: none;
      mix-blend-mode: screen
    }

    .furnace-shell-3d {
      position: absolute;
      left: 50%;
      top: 4%;
      width: 58%;
      height: 90%;
      transform: translateX(-50%) rotateX(6deg);
      transform-style: preserve-3d;
      filter: drop-shadow(0 0 22px rgba(20, 146, 255, .38))
    }

    .furnace-shell-3d:before {
      content: "";
      position: absolute;
      inset: 0;
      clip-path: polygon(31% 0, 69% 0, 82% 27%, 96% 87%, 4% 87%, 18% 27%);
      background: linear-gradient(90deg, #536575 0, #c7d3dc 26%, #506273 45%, #a7b5c1 62%, #455665 100%);
      box-shadow: inset 22px 0 30px rgba(255, 255, 255, .12), inset -18px 0 28px rgba(0, 0, 0, .42)
    }

    .furnace-shell-3d:after {
      content: "";
      position: absolute;
      left: 17%;
      right: 17%;
      top: 8%;
      bottom: 13%;
      clip-path: polygon(29% 0, 71% 0, 84% 30%, 94% 94%, 6% 94%, 16% 30%);
      background: linear-gradient(180deg, rgba(7, 22, 36, .98), rgba(10, 30, 42, .96));
      border: 2px solid rgba(152, 190, 213, .75);
      box-shadow: inset 0 0 28px rgba(8, 183, 255, .16)
    }

    .furnace-core-3d {
      position: absolute;
      left: 24%;
      right: 24%;
      top: 31%;
      bottom: 19%;
      z-index: 2;
      clip-path: polygon(15% 0, 85% 0, 100% 94%, 0 94%);
      background: linear-gradient(180deg, #12a6ff 0 5%, #ef3325 28%, #ff7c15 67%, #fff05b 100%);
      opacity: .96;
      box-shadow: inset 0 0 26px rgba(255, 242, 93, .45), 0 0 30px rgba(255, 85, 16, .34);
      animation: heatPulse 1.8s ease-in-out infinite
    }

    .furnace-molten-3d {
      position: absolute;
      left: 20%;
      right: 20%;

.report-tree{display:grid;gap:2px;font-size:12px}
.report-tree-folder{width:100%;min-height:30px;border:0;border-radius:7px;background:transparent;color:#dfe7ef;display:grid;grid-template-columns:18px 1fr auto;gap:6px;align-items:center;text-align:left;cursor:pointer;padding:5px 7px}
.report-tree-folder:hover{background:rgba(255,255,255,.07)}
.report-tree-folder.active{background:rgba(31,111,235,.25);color:#fff}
.report-tree-folder b{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800}
.report-tree-folder small{color:#8f9aa6}
.report-tree-folder.active small{color:#cfe4ff}
.report-tree-children{display:grid;gap:2px}
.report-scope-card{border:1px solid rgba(255,255,255,.09);border-radius:8px;background:rgba(255,255,255,.035);padding:10px;display:grid;gap:8px}
.report-scope-card b{color:#fff}
.report-scope-card span{color:#8f9aa6;font-size:12px;line-height:1.5;word-break:break-all}
.report-instance-list{display:grid;gap:7px;max-height:280px;overflow:auto;padding-right:2px}
.report-instance-row{border:1px solid rgba(255,255,255,.08);border-radius:8px;background:rgba(255,255,255,.035);padding:8px;display:grid;gap:7px}
.report-instance-row.active{border-color:#2388ff;background:rgba(31,111,235,.16)}
.report-instance-main{border:0;background:transparent;color:#edf3f8;text-align:left;padding:0;display:grid;gap:3px;cursor:pointer}
.report-instance-main b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.report-instance-main span{font-size:11px;color:#8f9aa6;line-height:1.45;word-break:break-all}
.report-preview-toolbar{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.report-preview-doc{max-width:960px;margin:0 auto;padding:22px 28px;background:#f8fafc;color:#17202a;border-radius:6px;box-shadow:0 12px 32px rgba(0,0,0,.24)}
.report-preview-doc h1{font-size:24px;margin:0 0 10px;color:#111827}
.report-preview-doc h2{font-size:16px;margin:18px 0 8px;color:#0f3a62}
.report-preview-doc p{line-height:1.65}
.report-preview-doc table{width:100%;border-collapse:collapse;font-size:13px}
.report-preview-doc th,.report-preview-doc td{border:1px solid #d7dde5;padding:8px 10px;text-align:left;vertical-align:top}
.report-preview-doc th{width:180px;background:#edf3f8;color:#1f2937}
.report-preview-doc td span{color:#64748b;font-size:12px}
.report-muted{color:#8f9aa6;font-size:12px;line-height:1.55}
.report-empty{height:100%;display:grid;place-items:center;text-align:center;color:#8f9aa6;line-height:1.7}
@media(max-width:1500px){.report-shell{grid-template-columns:290px 390px minmax(0,1fr)}.report-instance-list{max-height:220px}}
