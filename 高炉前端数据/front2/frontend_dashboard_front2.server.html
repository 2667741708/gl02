              .then(function(resp){ return resp.json(); })

                }

          }

      return nativeAdd(type, patched, options);

vals=function BFAlignedWindowValues(buffer,id,count){
  const timestamps=Array.isArray(buffer?.timestamps)?buffer.timestamps:[];
  const requested=Math.max(0,Math.floor(Number(count)||0));
  const windowSize=Math.min(requested,timestamps.length);
  if(!windowSize)return[];
  const series=Array.isArray(buffer?.[id])?buffer[id]:[];
  const values=series.slice(-windowSize);
  const times=timestamps.slice(-windowSize);
  return values.map((value,index)=>normVal(id,value,times[index],index));
};
