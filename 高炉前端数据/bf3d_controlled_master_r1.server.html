<!doctype html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11171a;color:#e5eceb;font-family:SimSun,"宋体",serif}
    body{display:grid;grid-template-rows:72px 1fr}.head{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid #3b494b;background:#182124}.head h1{margin:0;font-size:24px}.head p{margin:5px 0 0;color:#aebcba;font-size:14px}.badge{padding:7px 10px;border:1px solid #9a7d2d;border-radius:4px;color:#f2c94c;background:#292514}
    main{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:0}.viewport{position:relative;min-width:0;background:radial-gradient(circle at 50% 38%,#334043 0,#171d1f 58%,#0d1112 100%)}canvas{display:block;width:100%;height:100%}.loading{position:absolute;left:16px;top:14px;padding:8px 10px;background:#101719dd;border:1px solid #48595b;border-radius:4px;color:#dce8e6}
    aside{padding:14px;border-left:1px solid #3b494b;background:#182124;overflow:auto}.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{min-height:40px;border:1px solid #526365;border-radius:4px;background:#253033;color:#e5eceb;font:16px SimSun,"宋体",serif;cursor:pointer}button:hover{background:#303e41}button.active{border-color:#79aaa2;background:#31534e;color:#effffc}.card{margin-top:12px;padding:11px;border:1px solid #3c4a4c;border-radius:4px;background:#202a2d}.card h2{margin:0 0 9px;font-size:17px}.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #344143}.row:last-child{border:0}.row span{color:#aebcba}.ok{color:#74c991}.warn{color:#f2c94c}.bad{color:#e77970}.note{line-height:1.55;color:#b9c5c3;font-size:14px}.legend{display:flex;align-items:center;gap:8px}.dot{width:11px;height:11px;border-radius:50%;background:#f2c94c;box-shadow:0 0 8px #f2c94c}
    @media(max-width:900px){body{overflow:auto;grid-template-rows:auto auto}.head{align-items:flex-start;gap:10px}.head h1{font-size:20px}main{grid-template-columns:1fr;grid-template-rows:62vh auto}.viewport{min-height:420px}aside{border-left:0;border-top:1px solid #3b494b}}
  </style>
  <script type="importmap">{"imports":{"three":"./libs/three/three.module.js","three/addons/":"./libs/three/"}}</script>
</head>
<body data-load-state="loading" data-active-asset="whole">
  <header class="head"><div><h1>高炉受控母版 R1 浏览器预览</h1><p>R5/R2J/R2K + VIS30 静压力 · 独立只读检查</p></div><div class="badge">候选 · 非生产</div></header>
  <main>
    <section id="viewport" class="viewport" aria-label="三维模型预览"><div id="loading" class="loading">正在加载组合审查资产…</div></section>
    <aside>
      <div class="modes" role="group" aria-label="资产模块切换">
        <button class="active" data-asset="whole">整体高炉</button><button data-asset="cutaway">整体剖切</button>
        <button data-asset="combined">外壳+传感器</button><button data-asset="base">基础炉体</button>
        <button data-asset="sensors">18点传感器</button><button data-asset="structural">结构剖面</button>
      </div>
      <section class="card"><h2>运行检查</h2><div class="row"><span>加载状态</span><b id="state">加载中</b></div><div class="row"><span>网格数量</span><b id="meshes">—</b></div><div class="row"><span>材质数量</span><b id="materials">—</b></div><div class="row"><span>静压力点</span><b id="sensors">—</b></div><div class="row"><span>场景边界</span><b id="bounds">—</b></div></section>
      <section class="card"><h2>模块合同</h2><div class="row"><span>整体总装</span><b>33对象 / 48 Web网格</b></div><div class="row"><span>外壳+传感器</span><b>5 + 18</b></div><div class="row"><span>基础炉体</span><b>5</b></div><div class="row"><span>静压力</span><b>18</b></div><div class="row"><span>结构剖面</span><b>10对象 / 25 Web网格</b></div></section>
      <section class="card note"><div class="legend"><i class="dot"></i><b>工业黄色只表示传感器身份</b></div><p>纯材质和结构剖面资产不包含传感器、数据引线、黄色轮廓或工艺粒子。R5/R2J/R2K仍为E/illustrative，禁止作为施工数据。</p></section>
    </aside>
  </main>
  <script type="module" src="assets/bf3d-controlled-master-r1-preview.js?v=2"></script>
</body>
</html>
