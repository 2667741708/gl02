schema_version: "1.0"

model:
  version: "CZ-MOVEMENT-FEATURE-FUSION-2026.08"
  method: "interpretable_weighted_feature_fusion"
  evidence: "estimated"
  calibration_status: "uncalibrated"
  control_use: "prohibited"
  confidence_cap: 0.45

time:
  current_window_minutes: 15
  reference_window_minutes: 15
  reference_separation_minutes: 15
  min_samples_per_window: 5
  max_age_minutes: 5

decision:
  stable_score_threshold: 0.18
  probability_sharpness: 3.0
  stable_logit_bias: 1.25
  stable_logit_decay: 4.0
  min_scored_features: 4
  min_group_coverage: 0.25
  required_groups: ["pressure_permeability", "temperature_field"]

features:
  DP_total:
    label: "总压差"
    group: "pressure_permeability"
    columns: ["DP_total"]
    valid_min: 0.0
    valid_max: 600.0
    delta_scale: 20.0
    direction_up: 1.0
    movement_weight: 1.00
    risk_links: {channel: [1.0, 0.80], column: [1.0, 0.80]}
  PI:
    label: "透气性指数"
    group: "pressure_permeability"
    columns: ["PI"]
    valid_min: 0.01
    valid_max: 100.0
    delta_scale: 3.0
    direction_up: -1.0
    movement_weight: 0.90
    risk_links: {column: [1.0, 1.00]}
  P_top_volatility:
    label: "炉顶压力波动"
    group: "pressure_permeability"
    columns: ["P_top", "P_top_gas_A", "P_top_gas_B", "P_top_gas_C", "P_top_gas_D"]
